site_name: Hinton Problems
site_description: Implementations of synthetic learning problems from Geoffrey Hinton's experimental papers (1981–2022)
site_url: https://cybertronai.github.io/hinton-problems/
repo_url: https://github.com/cybertronai/hinton-problems
repo_name: cybertronai/hinton-problems

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

exclude_docs: |
  bin/
  .github/
  .git/
  *.py
  *.gz
  *.ipynb
  __pycache__/
  .cache/
  CONTRIBUTING.md

