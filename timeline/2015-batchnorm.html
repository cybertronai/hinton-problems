<p class="period">2015</p>
<h1>Batch normalization</h1>
<p class="people"><strong>Key people:</strong> Ioffe, Szegedy</p>
</header>
<figure class="diagram">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240">
  <!-- axes -->
  <line x1="60" y1="40" x2="60" y2="200" stroke="#333"/>
  <line x1="60" y1="200" x2="480" y2="200" stroke="#333"/>
  <text x="55" y="40" font-size="11" text-anchor="end">loss</text>
  <text x="475" y="218" font-size="11" text-anchor="end">training steps</text>
  <!-- without BN curve -->
  <path d="M60,80 Q120,90 180,100 Q260,110 320,120 Q400,130 460,135" stroke="#c44778" stroke-width="2.5" fill="none"/>
  <text x="270" y="105" font-size="12" fill="#c44778">no BN: slow + sensitive to init</text>
  <!-- with BN curve -->
  <path d="M60,80 Q90,140 130,165 Q180,185 240,192 Q300,196 460,198" stroke="#3d8b5e" stroke-width="2.5" fill="none"/>
  <text x="280" y="180" font-size="12" fill="#3d8b5e">with BN: faster + higher lr ok</text>
  <!-- formula -->
  <text x="270" y="30" text-anchor="middle" font-size="12" fill="#666">
    x̂ = (x − μ_batch) / √(σ²_batch + ε)   then   y = γx̂ + β
  </text>
</svg>
<figcaption>Normalize each batch to zero mean / unit variance, then re-scale with learned γ, β — faster convergence, higher learning rates.</figcaption>
</figure>
<section class="why">
<h2>Why it matters</h2>
<p>Stabilizes and accelerates training of deep nets, allowing higher learning rates and reducing sensitivity to initialization.</p>
</section>
